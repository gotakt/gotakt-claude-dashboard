<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Claude Session Dashboard">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151E31"/>
      <stop offset="1" stop-color="#0B111F"/>
    </linearGradient>
    <filter id="gl" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#tile)" stroke="#28344E" stroke-width="2"/>
  <!-- die fuenf Zustaende, in der Reihenfolge der Spalten -->
  <rect x="20" y="74"  width="14" height="30" rx="5" fill="#C084FC" filter="url(#gl)"/>
  <rect x="41" y="60"  width="14" height="44" rx="5" fill="#FF4D4D"/>
  <rect x="62" y="34"  width="14" height="70" rx="5" fill="#FF8C42"/>
  <rect x="83" y="52"  width="14" height="52" rx="5" fill="#3DDC84"/>
  <rect x="104" y="86" width="10" height="18" rx="4" fill="#4FC3F7" opacity=".65"/>
  <rect x="18" y="108" width="98" height="2.5" rx="1.25" fill="#28344E"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Claude Session Dashboard">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12161F"/>
      <stop offset="1" stop-color="#08090D"/>
    </linearGradient>
    <filter id="gl" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#tile)" stroke="#242B3A" stroke-width="2"/>

  <!-- vier Spalten, vier Zustaende -->
  <rect x="24" y="66" width="16" height="38" rx="6" fill="#FF4D4D"/>
  <rect x="48" y="34" width="16" height="70" rx="6" fill="#FF8C42" filter="url(#gl)"/>
  <rect x="72" y="54" width="16" height="50" rx="6" fill="#3DDC84"/>
  <rect x="96" y="80" width="16" height="24" rx="6" fill="#4A5262"/>

  <!-- Grundlinie -->
  <rect x="20" y="108" width="96" height="2.5" rx="1.25" fill="#242B3A"/>
</svg>
